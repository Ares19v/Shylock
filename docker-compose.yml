services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shylock-backend
    ports:
      - "8001:8001"
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8001/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped
    networks:
      - shylock-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shylock-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - shylock-net

networks:
  shylock-net:
    driver: bridge
